name: Website

# Builds spaghetti-code-foundry.com from docs/ and website/ and checks it (a broken link, anchor or image fails the build).
# The site is hosted on the owner's own web host: download the "website" artifact of a run and upload its contents there.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the sitemap dates come from git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the website (fails on a broken link, anchor or image)
        run: node website/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: website/dist
          retention-days: 30

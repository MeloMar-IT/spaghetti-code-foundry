name: Open pull request
category: GitHub
description: Opens a PR from the current branch that closes the issue, with Claude's change summary.
vars:
  github_repo: owner/repo
  issue: ""
steps:
  - id: open_pr
    type: shell
    repo_access: true
    run: |
      branch=$(git branch --show-current)
      existing=$(node "$FACTORY_TOOLS/story" pr-find "$branch" 2>/dev/null || true)
      if [ -n "$existing" ]; then echo "$existing"; node "$FACTORY_TOOLS/pr-output" "{{run.dir}}" "$existing" || true; exit 0; fi
      title=$(node "$FACTORY_TOOLS/story" title 2>/dev/null || echo "$FACTORY_TASK")
      out=$( {
        [ -n "$FACTORY_VAR_ISSUE" ] && { echo "Closes #$FACTORY_VAR_ISSUE"; echo; }
        echo "### Changes"
        printf '%s\n' "$FACTORY_OUT_IMPLEMENT"
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID -->"
      } | node "$FACTORY_TOOLS/story" pr-open --head "$branch" --title "${FACTORY_VAR_ISSUE:+#$FACTORY_VAR_ISSUE: }$title" ) || exit $?
      printf '%s\n' "$out"
      url=$(printf '%s\n' "$out" | tail -1)
      node "$FACTORY_TOOLS/pr-output" "{{run.dir}}" "$url" || true

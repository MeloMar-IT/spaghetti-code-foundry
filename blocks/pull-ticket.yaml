name: Pull ticket from GitHub
category: GitHub
description: "Fetches the GitHub issue set in var issue (title, body, labels, comments). Later steps use {{steps.pull_ticket.output}}."
vars:
  github_repo: owner/repo
  issue: ""
steps:
  - id: pull_ticket
    type: shell
    repo_access: true
    description: Read the GitHub issue as plain text
    run: |
      case "$FACTORY_VAR_ISSUE" in ''|*[!0-9]*) echo "set the 'issue' variable to an issue number (got '$FACTORY_VAR_ISSUE')"; exit 1;; esac
      node "$FACTORY_TOOLS/story" view > "{{run.dir}}/issue.json" 2>/dev/null || rm -f "{{run.dir}}/issue.json"
      node "$FACTORY_TOOLS/story" comments > "{{run.dir}}/issue-comments.jsonl" 2>/dev/null || rm -f "{{run.dir}}/issue-comments.jsonl"
      node "$FACTORY_TOOLS/story" foundry-comments > "{{run.dir}}/issue-foundry-comments.json" 2>/dev/null || rm -f "{{run.dir}}/issue-foundry-comments.json"
      node "$FACTORY_TOOLS/story" text

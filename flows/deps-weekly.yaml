# ─── List the outdated Maven, npm, Gradle, pip, Go and GitHub Actions dependencies of a repository ───
# Generated by scripts/build-flows.mjs from blocks/*.yaml — edit the blocks or the script.
# scf run deps-weekly --var github_repo=owner/name [--var develop_branch=develop]
# 
# clone → actions (newest release of each pinned action) → check (Maven, npm ci, npm outdated, npm audit, Gradle versions plugin, pip, Go, OSV scanner)
# Each update is patch, minor or major; npm audit and OSV scanner findings are marked security. The result is in deps.json and in the output of check.
# A tool that is missing or fails is a note; the run stays green. Nothing is written to the repository or to GitHub.
# ────────────────────────────────────────────────────────────────────────
name: deps-weekly
description: Lists the outdated Maven, npm, Gradle, pip, Go and GitHub Actions dependencies of the develop branch as patch, minor or major updates, marks the ones npm audit or the OSV scanner list as security, and files nothing
workspace: empty
defaults:
  timeout_sec: 5400
vars:
  github_repo: owner/repo
  develop_branch: ""
  chore_watcher: ""
var_info:
  github_repo: &a1
    set_by_run: true
  develop_branch:
    label: Branch to check
    help: "The branch to clone. Empty: develop, else the default branch."
    kind: text
  chore_watcher: *a1
steps:
  - id: clone
    type: shell
    repo_access: true
    description: Clone the repository into repo/ (ref, else develop_branch, else develop, else the default branch); the checks cannot push
    run: |-
      r="$FACTORY_VAR_GITHUB_REPO"; ok=no; loc=no
      case "$r" in */*) ok=yes ;; esac
      case "$r" in ""|-*|/*|*/|*/*/*|*[!A-Za-z0-9._/-]*) ok=no ;; esac
      case "$r" in local:*) ok=no; s="${r#local:}"; case "$s" in [a-z0-9]*-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) case "$s" in *[!a-z0-9._-]*) ;; *) [ "${#s}" -le 49 ] && { ok=yes; loc=yes; } ;; esac ;; esac ;; esac
      [ "$ok" = yes ] || { echo "set the variable github_repo to owner/name"; exit 1; }
      if [ "$loc" = yes ]; then [ -n "$FACTORY_LOCAL_REPO_DIR" ] || { echo "the folder of this local project is not known to the Foundry"; exit 1; }; git clone -q -- "$FACTORY_LOCAL_REPO_DIR" repo || { echo "could not clone $r"; exit 1; }
      elif [ -n "$FACTORY_REPO_URL" ]; then git clone -q -- "$FACTORY_REPO_URL" repo || { echo "could not clone $r"; exit 1; }
      else gh repo clone "https://github.com/$r" repo -- -q -c credential.helper= -c 'credential.helper=!gh auth git-credential' || { echo "could not clone $r"; exit 1; }; fi
      ref="$FACTORY_VAR_REF"; dev="$FACTORY_VAR_DEVELOP_BRANCH"
      plain() { printf '%s\n' "$1" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$' && ! printf '%s\n' "$1" | grep -q '\.\.'; }
      have() { git -C repo show-ref --verify --quiet "refs/remotes/origin/$1"; }
      if [ -n "$ref" ]; then { plain "$ref" && have "$ref"; } || { echo "the branch $ref (the variable ref) does not exist in $r"; exit 1; }; branch=$ref
      elif [ -n "$dev" ] && plain "$dev" && have "$dev"; then branch=$dev
      elif have develop; then branch=develop
      else branch=$(git -C repo symbolic-ref --short HEAD); fi
      git -C repo checkout -q "$branch" || { echo "could not check out $branch"; exit 1; }
      echo "branch: $branch"
      echo "BASE: $(git -C repo rev-parse HEAD)"
      git -C repo remote remove origin 2>/dev/null || true
      git -C repo config --local --unset-all credential.helper 2>/dev/null || true
  - id: actions
    type: shell
    repo_access: true
    description: Look up the newest release of each GitHub Action pinned in the workflows and write actions.json; runs no repository code
    timeout_sec: 600
    run: node "$FACTORY_TOOLS/deps-weekly" actions "{{run.dir}}"
  - id: check
    type: shell
    description: List the outdated Maven, npm, Gradle, pip, Go and GitHub Actions dependencies (patch, minor, major, security) and write deps.json; a missing tool is a note
    timeout_sec: 5400
    run: node "$FACTORY_TOOLS/deps-weekly" check "{{run.dir}}"

# ─── Daily release pull request develop → main (gitflow) ───────────────
# Generated by scripts/build-flows.mjs from blocks/*.yaml — edit the blocks or the script.
# factory run release-daily --var github_repo=owner/repo --var test_cmd="./gradlew test"
# (a schedule watcher runs this once a day, e.g. 17:00 Europe/Berlin)
# 
# clone → develop ahead of main? ─┬─ no → end
#                                 └─ full tests (skipped when this exact code already passed them: reuse_test_results) + build on develop (limit verify_timeout_min, 180 min; the slot wait does not count)
#                                    → open / update the PR develop → main
#                                    (lists and closes the merged issues; draft while red or not finished in time) → comment the checks
#                                    → handoff (check the contract, then ready or draft)
#                                    A local project (github_repo local:…) has no pull request: green checks → list the stories → wait for the owner's OK
#                                    (Make this version final) → merge the tested develop into main (--no-ff) in the owner's folder, tag release-<date>,
#                                    close the stories, keep the release files (when .factory/release-build.yaml exists) → report; not yet → a note on the stories
# ────────────────────────────────────────────────────────────────────────
name: release-daily
description: "Once a day: full tests and build on develop, then one pull request develop → main that closes the merged issues"
workspace: empty
defaults:
  timeout_sec: 3600
vars:
  github_repo: owner/repo
  test_cmd: auto
  build_cmd: ""
  develop_branch: develop
  main_branch: main
  verify_timeout_min: "180"
  reuse_test_results: yes
var_info:
  github_repo:
    set_by_run: true
  test_cmd:
    label: Test command
    help: Use auto to find the command from the project files, or type the command that builds and tests the project.
    kind: text
  build_cmd:
    label: Build command
    help: "The command that builds the project. Empty: no build."
    kind: text
  develop_branch:
    label: Develop branch
    help: The branch that feature branches are merged into.
    kind: text
  main_branch:
    label: Main branch
    help: The branch that releases go to.
    kind: text
  verify_timeout_min:
    label: Check time limit (minutes)
    help: How long the full tests and build of the daily check may work, in minutes. The wait for a test slot does not count. At the limit they are stopped and the pull request stays a draft. 1 to 720.
    kind: number
    min: 1
    max: 720
  reuse_test_results:
    label: Reuse test results
    help: Skip a test run when the same code was already tested.
    kind: yes_no
steps:
  - id: clone
    type: shell
    repo_access: true
    run: |-
      if [ -d .git ]; then git fetch -q origin; elif [ -n "$FACTORY_LOCAL_REPO_DIR" ]; then git clone -q -- "$FACTORY_LOCAL_REPO_DIR" .; elif [ -n "$FACTORY_REPO_URL" ]; then git clone -q -- "$FACTORY_REPO_URL" .; else gh repo clone "$FACTORY_VAR_GITHUB_REPO" . -- -q; fi
      git log --oneline -1
  - id: changes
    type: shell
    description: What develop has that main doesn't
    run: |-
      dev="$FACTORY_VAR_DEVELOP_BRANCH"; main="$FACTORY_VAR_MAIN_BRANCH"
      git rev-parse -q --verify "origin/$dev" >/dev/null || { echo "NONE: there is no $dev branch yet"; exit 0; }
      n=$(git rev-list --count "origin/$main..origin/$dev"); [ "$n" -gt 0 ] || { echo "NONE: $dev has nothing new"; exit 0; }
      git checkout -q -B "$dev" "origin/$dev"
      echo "$n commits on $dev that are not on $main:"; git log --format="%s" "origin/$main..origin/$dev" | grep -E "^(Merge #|Resolve #)" | sort -u
    routes:
      - if: "^NONE:"
        goto: end
  - id: verify
    type: shell
    description: Full tests and build on develop
    timeout_sec: 68400
    run: |-
      export FACTORY_TEST_SLOT_WAIT_SEC="${FACTORY_TEST_SLOT_WAIT_SEC:-300}"
      cmd="$FACTORY_VAR_TEST_CMD"; if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      whole() { case "$1" in ""|0*|*[!0-9]*) return 1 ;; esac; [ "${#1}" -le 6 ] && [ "$1" -le "$2" ]; }
      mins=180; v="$FACTORY_VAR_VERIFY_TIMEOUT_MIN"
      if [ -n "$v" ]; then if whole "$v" 720; then mins=$v; else printf 'verify_timeout_min "%s" is not a whole number from 1 to 720 — using 180\n' "$v"; fi; fi
      limit=$((mins * 60))
      v="$FACTORY_CHECK_LIMIT_SEC"
      if [ -n "$v" ]; then if whole "$v" 43200; then limit=$v; else printf 'FACTORY_CHECK_LIMIT_SEC "%s" is not a whole number from 1 to 43200 — ignored\n' "$v"; fi; fi
      w="$FACTORY_TEST_SLOT_WAIT_SEC"
      case "$w" in ""|*[!0-9]*) ;; *) if [ "${#w}" -gt 9 ] || [ "$w" -gt 21600 ]; then export FACTORY_TEST_SLOT_WAIT_SEC=21600; echo "the wait for a test slot is capped at 21600 s"; fi ;; esac
      track="{{run.dir}}/check.procs"; : > "$track"
      fmt() { if [ "$1" -lt 60 ]; then printf '%d s' "$1"; elif [ "$1" -lt 3600 ]; then printf '%d min' $(($1 / 60)); else printf '%d h %d min' $(($1 / 3600)) $(($1 % 3600 / 60)); fi; }
      tree=""; if t=$(git rev-parse "HEAD^{tree}") && st=$(git status --porcelain) && [ -z "$st" ]; then tree="$t"; fi
      hit=""; if [ "$FACTORY_VAR_REUSE_TEST_RESULTS" != no ] && [ -n "$tree" ] && [ -n "$cmd" ]; then
        key=$(printf '%s\n%s\n' "$tree" "$cmd" | shasum | cut -c1-40); f="{{run.dir}}/../../tested/$key"
        if [ "${#key}" -eq 40 ] && [ -f "$f" ] && [ ! -L "$f" ]; then
          line=$(head -c 200 "$f" 2>/dev/null | head -1)
          hit=$(printf '%s\n' "$line" | sed -nE 's/^(run [A-Za-z0-9_-]{1,64}, [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}Z)(, tree [0-9a-f]{40})?$/\1/p')
          case "$line" in *", tree "*) [ "$line" = "$hit, tree $tree" ] || hit="" ;; esac
        fi
      fi
      marker="{{run.dir}}/tests.marker"; touch "$marker"; ok=yes
      timed=""; bnote=""; used=0
      if [ -n "$hit" ]; then echo "\$ $cmd"; echo "not run again: this exact code already passed these tests ($hit)"
      else
      started="{{run.dir}}/tests.started"; rm -f "$started"; before=$(date +%s); timed=""; bnote=""
      FACTORY_TEST_SLOT_LIMIT_SEC="$limit" FACTORY_TEST_SLOT_STARTED_FILE="$started" FACTORY_TEST_SLOT_TRACK_FILE="$track" "$FACTORY_TOOLS/test-slot" "{{run.dir}}/../../test-slots" sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      [ "$code" -eq 0 ] || ok=no
      if [ "$code" -eq 124 ] && tail -n 1 "{{run.dir}}/tests.log" | grep -q "^test-slot: stopped after "; then timed=tests; fi
      t0=$(head -n 1 "$started" 2>/dev/null); case "$t0" in ""|*[!0-9]*) t0=$before ;; esac
      used=$(($(date +%s) - t0)); [ "$used" -ge 0 ] || used=0
      fi
      record=no; if [ "$ok" = yes ] && [ -z "$hit" ] && [ -n "$tree" ] && [ -n "$cmd" ] && st=$(git status --porcelain) && [ -z "$st" ] && after_tree=$(git rev-parse "HEAD^{tree}") && [ "$after_tree" = "$tree" ]; then record=yes; fi
      if [ -n "$FACTORY_VAR_BUILD_CMD" ]; then
        left=$((limit - used))
        if [ -n "$timed" ] || [ "$left" -le 0 ]; then bnote="not run (no time left)"; ok=no; [ -n "$timed" ] || timed=build
        else FACTORY_VAR_TEST_SLOTS=0 FACTORY_TEST_NICE=0 FACTORY_TEST_SLOT_LIMIT_SEC="$left" FACTORY_TEST_SLOT_TRACK_FILE="$track" "$FACTORY_TOOLS/test-slot" "{{run.dir}}/../../test-slots" sh -c "$FACTORY_VAR_BUILD_CMD" > "{{run.dir}}/build.log" 2>&1; code=$?
          [ "$code" -eq 0 ] || ok=no
          if [ "$code" -eq 124 ] && tail -n 1 "{{run.dir}}/build.log" | grep -q "^test-slot: stopped after "; then timed=build; fi
        fi
      fi
      if [ "$record" = yes ] && [ -z "$timed" ]; then
        key=$(printf '%s\n%s\n' "$tree" "$cmd" | shasum | cut -c1-40)
        if [ "${#key}" -eq 40 ]; then { mkdir -p "{{run.dir}}/../../tested" && printf 'run %s, %s, tree %s\n' "$FACTORY_RUN_ID" "$(date -u +%Y-%m-%dT%H:%MZ)" "$tree" > "{{run.dir}}/../../tested/$key"; } 2>/dev/null || true; fi
      fi
      { echo "### Checks on $FACTORY_VAR_DEVELOP_BRANCH"; echo '```'; echo "\$ $cmd"; if [ -n "$hit" ]; then echo "not run again: this exact code already passed these tests ($hit)"; else "$FACTORY_TOOLS/test-summary" "$marker"; fi
        [ -n "$FACTORY_VAR_BUILD_CMD" ] && echo "\$ $FACTORY_VAR_BUILD_CMD → ${bnote:-$(grep -q "BUILD SUCCESSFUL" "{{run.dir}}/build.log" 2>/dev/null && echo ok || tail -1 "{{run.dir}}/build.log")}"
        echo '```'; if [ -n "$timed" ]; then if [ "$timed" = tests ]; then what="the tests"; else what="the build"; fi; echo "⏱ **Checks did not finish in time** — the time limit of $(fmt "$limit") (verify_timeout_min) ran out before $what finished, so they were stopped. The wait for a test slot does not count. Marked as draft; see the run log."; elif [ "$ok" != yes ]; then echo "⚠ **Checks failed** — marked as draft until they pass. See the run log for details."; fi; } > "{{run.dir}}/checks.md"
      cat "{{run.dir}}/checks.md"; echo "CHECKS: $ok"
  - id: release_pr
    type: shell
    repo_access: true
    description: Open or update the pull request develop → main, comment the checks, draft while red
    routes:
      - if: ^LOCAL\s*$
        goto: final_ask
    run: |-
      case "$FACTORY_VAR_GITHUB_REPO" in local:*) echo "LOCAL"; exit 0;; esac
      dev="$FACTORY_VAR_DEVELOP_BRANCH"; main="$FACTORY_VAR_MAIN_BRANCH"; day=$(date +%Y-%m-%d)
      nums=$(git log --format="%s" "origin/$main..origin/$dev" | sed -nE "s/^(Merge|Resolve) #([0-9]+).*/\2/p" | sort -un)
      { echo "Everything merged into \`$dev\` since the last release. Merge this to bring it to \`$main\`."; echo; echo "### Issues"
        for n in $nums; do echo "- #$n $(git log --format=%s "origin/$main..origin/$dev" | grep -m1 -E "^(Merge|Resolve) #$n:" | sed "s/^[^:]*: *//")"; done
        echo; for n in $nums; do echo "Closes #$n"; done; echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID release -->"; } > "{{run.dir}}/pr.md"
      title="Release $day: $(for n in $nums; do printf '#%s ' "$n"; done | sed 's/ $//; s/ /, /g')"
      if printf '%s\n' "$FACTORY_OUT_VERIFY" | grep -q "^CHECKS: no"; then ok=no; first="$FACTORY_FIRST_DRAFT"; else ok=yes; first="$FACTORY_FIRST_MERGE_RELEASE"; fi
      created=""; draft=""; if [ "$ok" = no ]; then draft=--draft; fi
      pr=$(node "$FACTORY_TOOLS/story" pr-list --head "$dev" --base "$main" \
        | node -e 'let d="";process.stdin.on("data",(c)=>(d+=c)).on("end",()=>{const p=JSON.parse(d||"[]").find((x)=>x.headRefName===process.argv[1]&&x.state==="OPEN");process.stdout.write(p?String(p.number):"")})' "$dev")
      if [ -n "$pr" ]; then node "$FACTORY_TOOLS/story" pr-edit "$pr" --title "$title" <"{{run.dir}}/pr.md" >/dev/null
      else pr=$(node "$FACTORY_TOOLS/story" pr-open --base "$main" --head "$dev" --title "$title" $draft <"{{run.dir}}/pr.md" | tail -1); pr=${pr##*/}; created=yes; fi
      case "$pr" in ''|*[!0-9]*) ;; *) node "$FACTORY_TOOLS/pr-output" "{{run.dir}}" "https://github.com/$FACTORY_VAR_GITHUB_REPO/pull/$pr" || true;; esac
      { echo "$first"; echo
        echo "🤖 **Spaghetti Code Foundry daily release check** — $(date '+%Y-%m-%d %H:%M')"; echo; cat "{{run.dir}}/checks.md"; echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID daily -->"; } \
        | node "$FACTORY_TOOLS/story" pr-comment "$pr" >/dev/null
      echo "PR: $pr"; echo "TITLE: $title"
      if [ -n "$created" ] && [ -n "$draft" ]; then echo "DRAFT: yes"; fi
  - id: handoff
    type: shell
    repo_access: true
    timeout_sec: 1800
    description: Check the signed delivery contract, keep the delivery comment, then mark the pull request ready or draft
    run: |-
      pr=$(printf '%s\n' "$FACTORY_OUT_RELEASE_PR" | sed -n 's/^PR: \([0-9][0-9]*\)$/\1/p' | tail -1)
      title=$(printf '%s\n' "$FACTORY_OUT_RELEASE_PR" | sed -n 's/^TITLE: //p' | tail -1)
      [ -n "$pr" ] || { echo "the release pull request is not known"; exit 1; }
      draft() { node "$FACTORY_TOOLS/story" pr-ready "$pr" --undo >/dev/null 2>&1; }
      if [ -n "$FACTORY_DELIVERY_PUBLIC_KEY" ]; then draft || echo "PR #$pr could not be made a draft before the check"; fi
      node "$FACTORY_TOOLS/delivery-handoff" "{{run.dir}}"; code=$?
      if [ "$code" -ne 0 ]; then
        if draft; then echo "delivery stopped — PR #$pr is a draft"; else echo "delivery stopped — PR #$pr could not be made a draft"; fi
        exit 1
      fi
      drafted=$(printf '%s\n' "$FACTORY_OUT_RELEASE_PR" | sed -n 's/^DRAFT: //p' | tail -1)
      if printf '%s\n' "$FACTORY_OUT_VERIFY" | grep -q "^CHECKS: no"; then
        if [ "$drafted" = yes ] || draft; then echo "checks failed — PR #$pr is a draft"; else echo "checks failed — could not mark PR #$pr as a draft"; fi
      elif node "$FACTORY_TOOLS/story" pr-ready "$pr" >/dev/null 2>&1; then echo "checks passed — PR #$pr ($title) is ready to merge"
      else echo "checks passed — PR #$pr could not be marked ready"; exit 1; fi
  - id: final_ask
    type: shell
    repo_access: true
    jump_only: true
    description: "Local project: stop when the checks failed, else list the finished stories that would go into main"
    run: |-
      dev="$FACTORY_VAR_DEVELOP_BRANCH"; main="$FACTORY_VAR_MAIN_BRANCH"
      if printf '%s\n' "$FACTORY_OUT_VERIFY" | grep -q "^CHECKS: no"; then echo "The checks on $dev did not pass, so nothing is asked. Make $dev green first; the next daily check looks again."; exit 1; fi
      sha=$(git rev-parse HEAD) || exit 1
      [ "$sha" = "$(git rev-parse "origin/$dev")" ] || { echo "$dev changed while it was tested; the next daily check looks again"; exit 1; }
      printf '%s\n' "$sha" > "{{run.dir}}/final-sha"
      nums=$(git log --format="%s" "origin/$main..$sha" | sed -nE "s/^(Merge|Resolve) #([0-9]+).*/\2/p" | sort -un)
      : > "{{run.dir}}/final-stories"; for n in $nums; do echo "$n" >> "{{run.dir}}/final-stories"; done
      echo "These finished changes go to $main:"
      if [ -z "$nums" ]; then echo "- other changes ($(git rev-list --count "origin/$main..$sha") commits)"; fi
      for n in $nums; do
        t=$(FACTORY_VAR_ISSUE=$n node "$FACTORY_TOOLS/story" title 2>/dev/null | head -n 1)
        [ -n "$t" ] || t=$(git log --format=%s "origin/$main..$sha" | grep -m1 -E "^(Merge|Resolve) #$n:" | sed "s/^[^:]*: *//")
        printf '%s\n' "- #$n $t"
      done
    on_success: make_final
  - id: make_final
    type: approval
    jump_only: true
    message: |-
      Make this version final?
      {{steps.final_ask.output}}
    on_success: final_merge
    on_failure: final_rejected
  - id: final_merge
    type: shell
    repo_access: true
    jump_only: true
    max_visits: 3
    timeout_sec: 1800
    description: "Local project: merge the tested develop into main (--no-ff), tag it, and bring both into the owner's folder"
    routes:
      - if: ^MOVED\s*$
        goto: final_merge
    run: |-
      loc=no; case "$FACTORY_VAR_GITHUB_REPO" in local:*) loc=yes; [ -n "$FACTORY_LOCAL_REPO_DIR" ] || { echo "the folder of this local project is not known to the Foundry"; exit 1; } ;; esac
      [ "$loc" = yes ] || { echo "this step is only for a local project"; exit 1; }
      dev="$FACTORY_VAR_DEVELOP_BRANCH"; main="$FACTORY_VAR_MAIN_BRANCH"; day=$(date +%Y-%m-%d); rd="{{run.dir}}"
      sha=$(cat "$rd/final-sha" 2>/dev/null); case "$sha" in ""|*[!0-9a-f]*) echo "the tested commit is not known; the next daily check asks again"; exit 1 ;; esac
      old=$(cat "$rd/final-tag" 2>/dev/null); case "$old" in release-*) git tag -d "$old" >/dev/null 2>&1 ;; *) old="" ;; esac
      git reset -q --hard && git clean -qfd
      git fetch -q --force --tags origin || { echo "could not read your folder (git fetch failed)"; exit 1; }
      pick() { t="release-$day"; i=2; while git rev-parse -q --verify "refs/tags/$t" >/dev/null 2>&1; do t="release-$day-$i"; i=$((i + 1)); done; echo "$t"; }
      git checkout -q -B "$main" "refs/remotes/origin/$main" || { echo "could not check out $main"; exit 1; }
      if git merge-base --is-ancestor "$sha" "refs/remotes/origin/$main"; then
        mc=$(git rev-list --first-parent --parents "refs/remotes/origin/$main" | awk -v s="$sha" '$3 == s { print $1; exit }')
        [ -n "$mc" ] || mc="$sha"
        tag="$old"
        if [ -n "$tag" ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1 && [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$mc" ]; then tag=""; fi
        [ -n "$tag" ] || tag=$(pick)
        printf '%s\n' "$tag" > "$rd/final-tag"
        git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1 || git tag -a "$tag" -m "Release $tag" "$mc" || { echo "could not make the tag $tag"; exit 1; }
        echo "$main already holds the tested $dev commit; making sure the tag $tag is in your folder"
      else
        tag=$(pick)
        printf '%s\n' "$tag" > "$rd/final-tag"
        if ! git merge --no-ff --no-edit -m "Release $tag: $dev into $main" "$sha" >/dev/null 2>&1; then
          git merge --abort >/dev/null 2>&1; echo "$dev cannot be merged into $main without a conflict, so nothing was changed. Bring $main into $dev and fix it there; the next daily check asks again."; exit 1
        fi
        git tag -a "$tag" -m "Release $tag" || { echo "could not make the tag $tag"; exit 1; }
      fi
      out=$(node "$FACTORY_TOOLS/local-branch" release "$main" "$tag" 2>&1); code=$?; printf '%s\n' "$out"
      case "$code" in
        0) rm -f "$rd/final-remote"
           echo "FINAL: $main now holds the tested $dev ($(git rev-parse --short "$sha")) and is tagged $tag"
           if [ "$FACTORY_LOCAL_PUSH" = yes ]; then node "$FACTORY_TOOLS/local-branch" push "$main" --tag "$tag" 2>&1 | head -n 1 > "$rd/final-remote"; cat "$rd/final-remote"; fi
           exit 0 ;;
        3) echo "$main in your folder moved meanwhile — merging again"; echo "MOVED"; exit 0 ;;
        4) echo "$main is checked out in your folder and has changes that are not committed. Commit or stash them, then resume this run; $main was not changed."; exit 1 ;;
        *) if printf '%s\n' "$out" | grep -qE "^TAG_FAILED:.*(another object|already exists|rejected|fetch first)"; then git tag -d "$tag" >/dev/null 2>&1; echo "the tag $tag is taken — trying the next name"; echo "MOVED"; exit 0; fi
           echo "the final version could not be completed (see above); resume this run to try again"; exit 1 ;;
      esac
    on_success: final_close
  - id: final_close
    type: shell
    repo_access: true
    jump_only: true
    description: "Local project: close the stories that went in and note the tag on each (a resume does the rest)"
    run: |-
      tag=$(cat "{{run.dir}}/final-tag" 2>/dev/null); [ -n "$tag" ] || { echo "the tag is not known"; exit 1; }
      msg="This is in the final version \`$tag\`."
      closed=""; failed=""
      for n in $(cat "{{run.dir}}/final-stories" 2>/dev/null); do
        case "$n" in ""|*[!0-9]*) continue ;; esac
        export FACTORY_VAR_ISSUE=$n
        if ! node "$FACTORY_TOOLS/story" close --reason completed >/dev/null 2>&1; then failed="$failed #$n"; continue; fi
        have=$(node "$FACTORY_TOOLS/story" comments 2>/dev/null) || { failed="$failed #$n"; continue; }
        if ! printf '%s\n' "$have" | grep -qF -- "$msg"; then
          { echo "$FACTORY_FIRST_INFO"; echo; printf '%s\n' "$msg"; } \
            | node "$FACTORY_TOOLS/story" comment >/dev/null 2>&1 || { failed="$failed #$n"; continue; }
        fi
        closed="$closed #$n"
      done
      echo "CLOSED:${closed:- none}"
      if [ -n "$failed" ]; then echo "could not close or comment:$failed — resume this run to do the rest"; exit 1; fi
    on_success: final_files
  - id: final_files
    type: shell
    repo_access: true
    jump_only: true
    timeout_sec: 86400
    description: "Local project: build the release files when the project has a recipe, and keep them in the data folder"
    run: |-
      tag=$(cat "{{run.dir}}/final-tag" 2>/dev/null)
      [ -n "$tag" ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1 || { echo "NO_FILES: the tag is not known"; exit 0; }
      git cat-file -e "$tag:.factory/release-build.yaml" 2>/dev/null || { echo "NO_FILES: this project has no release recipe (.factory/release-build.yaml)"; exit 0; }
      "$FACTORY_TOOLS/area-lock" acquire "$FACTORY_RUN_ID" "{{run.dir}}" @release-build --wait-sec 3000 >/dev/null || { echo "another release-build run of this repository holds the lock — resume this run when it is done"; exit 1; }
      bad() { "$FACTORY_TOOLS/area-lock" release "$FACTORY_RUN_ID" @release-build >/dev/null 2>&1; echo "$1 — main is final and tagged; the release files could not be made. Resume this run to try again."; exit 1; }
      export FACTORY_VAR_REF="$tag"
      node "$FACTORY_TOOLS/release-build" resolve "{{run.dir}}" || bad "the release recipe could not be read"
      node "$FACTORY_TOOLS/release-build" build "{{run.dir}}" "{{run.dir}}/../../test-slots" || bad "the build failed"
      node "$FACTORY_TOOLS/release-upload" "{{run.dir}}" --local-tag "$tag" || bad "the files could not be kept"
      "$FACTORY_TOOLS/area-lock" release "$FACTORY_RUN_ID" @release-build >/dev/null 2>&1; exit 0
    on_success: final_report
  - id: final_report
    type: shell
    jump_only: true
    description: "Local project: one summary of the final version"
    run: |-
      main="$FACTORY_VAR_MAIN_BRANCH"; tag=$(cat "{{run.dir}}/final-tag" 2>/dev/null); sha=$(cat "{{run.dir}}/final-sha" 2>/dev/null)
      echo "Final version $tag is on $main (tested commit $(printf '%.7s' "$sha"))."
      printf '%s\n' "$FACTORY_OUT_FINAL_CLOSE" | sed -n "s/^CLOSED:/Stories closed:/p"
      if printf '%s\n' "$FACTORY_OUT_FINAL_FILES" | grep -q "^NO_FILES"; then echo "Release files: no release files"
      else printf '%s\n' "$FACTORY_OUT_FINAL_FILES" | sed -n "s/^KEPT[^:]*: [0-9]* files in /Release files: /p"; fi
      if [ -s "{{run.dir}}/final-remote" ]; then echo "Remote: $(head -n 1 "{{run.dir}}/final-remote")"; fi
    on_success: end
  - id: final_rejected
    type: shell
    repo_access: true
    jump_only: true
    description: "Local project: the owner said not yet — nothing changes in main or develop; a note goes on the stories"
    run: |-
      dev="$FACTORY_VAR_DEVELOP_BRANCH"
      note=$(printf '%s\n' "$FACTORY_OUT_MAKE_FINAL" | sed '1s/^rejected by [^:]*\(: \)\{0,1\}//' | head -c 1000)
      for n in $(cat "{{run.dir}}/final-stories" 2>/dev/null); do
        case "$n" in ""|*[!0-9]*) continue ;; esac
        export FACTORY_VAR_ISSUE=$n
        { echo "$FACTORY_FIRST_INFO"; echo; if [ -n "$note" ]; then printf 'Not made final yet: %s. ' "$note"; else printf 'Not made final yet. '; fi; echo "It stays on \`$dev\`; the next daily check asks again."; } \
          | node "$FACTORY_TOOLS/story" comment >/dev/null 2>&1 || echo "could not note it on #$n"
      done
      echo "Kept on $dev: nothing was merged. ${note:+Reason: $note}"
    on_success: end

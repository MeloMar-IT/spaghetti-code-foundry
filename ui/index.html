<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spaghetti Code Foundry</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="signed-out">
  <header class="top">
    <a class="brand" href="#/home"><span class="logo">◆</span> <span class="brand-full">Spaghetti Code Foundry</span><span class="brand-short">Foundry</span></a>
    <nav aria-label="Pages">
      <a href="#/start" data-nav="start">Start work</a>
      <a href="#/home" data-nav="home">Home<span id="turn-badge" class="badge" hidden></span></a>
      <a href="#/board" data-nav="board">Board</a>
      <a href="#/refinement" data-nav="refinement">Refinement</a>
      <a href="#/runs" data-nav="runs">Runs</a>
      <a href="#/repos" data-nav="repos">Repositories</a>
      <span class="nav-gap" aria-hidden="true"></span>
      <a href="#/flows" data-nav="flows" class="setup">Flows</a>
      <a href="#/users" data-nav="administration" class="setup">Administration</a>
    </nav>
    <span class="repo" id="repo" title="Repository this UI works against"></span>
    <span id="user" class="user" hidden></span>
  </header>
  <nav id="subnav" class="subnav" aria-label="Section" hidden></nav>
  <nav id="crumbs" class="crumbs" aria-label="Breadcrumb" hidden></nav>
  <div id="health" class="health" hidden></div>
  <div id="since" class="since" hidden></div>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main id="main"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>

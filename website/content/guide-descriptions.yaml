# Search-result descriptions of the user-guide pages (key: the page's path below /guide/). At most 155 characters.
# A page without an entry uses its first paragraph.
1-start: "Start the Foundry: sign in, the sidebar and + New change, the Simple, Advanced and Admin views, the five looks, the setup check and the Get started guide."
2-run-a-flow: "Run a flow by hand: choose a flow, a repository and a task, review the inputs before it starts, and build and upload release files on this machine."
3-follow-approve-and-resume-runs: "Follow your changes: Today and what needs you, since you last looked, the health line, the board, and Releases with the expected finish of each epic."
3-follow-approve-and-resume-runs/stories-as-files: "Stories as files and local projects without GitHub: moving them to GitHub, Try it previews, safe points and Restore, repository context and saved views."
3-follow-approve-and-resume-runs/the-runs-list: "The Changes list: every run in sections, the ones that need you on top, with search and filters, density, archiving and how long a run will take."
3-follow-approve-and-resume-runs/a-run: "The page of a change: five phases and three tabs, approvals, checks to try with Works or Not quite, and text from outside the flow."
3-follow-approve-and-resume-runs/when-something-goes-wrong: "When a change goes wrong: answer its questions, the failure summary, daily caps, failures of the Foundry itself, small screens and the words it uses."

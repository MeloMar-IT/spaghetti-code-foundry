# Search-result descriptions of the user-guide pages (key: the page's path below /guide/). At most 155 characters.
# A page without an entry uses its first paragraph.
1-start: "Start Spaghetti Code Foundry: create the admin account, sign in, find your way around Home, the board and runs, and learn the day in four steps."
2-run-a-flow: "Run a flow by hand: choose a flow, a repository and a task, review the inputs before the run starts, and see where the work happens."
3-follow-approve-and-resume-runs: "Follow your work in the Foundry: Home, your turn, the health line, the board, epics, saved views, the runs list, approvals and resuming failed runs."
4-write-your-own-flows: "Write your own flows: the visual editor and YAML, step types, controlling the path, passing information between steps, variables and the block library."
5-models-agents-and-routing: "Choose agents and models: Claude Code and Codex, model specs, Anthropic, OpenAI and local providers, and routing rules with fallbacks per step."
6-automate-with-watchers: "Automate work with watchers: start flows from labelled GitHub issues, pull request reviews, red CI builds or a schedule, and manage them per repository."
6-automate-with-watchers/the-monitor-the-foundry-checks-itself: "How the Foundry checks itself: the monitor's findings, bug stories it creates, the off switch and quiet time, the circuit breaker and the Problems page."
6-automate-with-watchers/how-issue-watchers-use-labels: "How issue watchers use labels: which issues are picked up, bug stories first, and the status comment that tells you what happens next."
6-automate-with-watchers/the-label-pipeline-one-label--plan--code--one-pull-request: "The label pipeline: one Factory_go label takes a story through questions, a risk-scored plan, code, reviews and merge, with one release pull request a day."
6-automate-with-watchers/keep-it-running: "Keep the Foundry running: the macOS login service, self-update, helper processes, the model analyst and the command line for a running server."
7-settings-and-safety: "Settings and safety: accounts and roles, repository sign-ins, protected branches, the secret scan, approvals, sandboxing, budgets and capacity."
7-settings-and-safety/automatic-skills: "Automatic skills: how the Foundry picks skills for a run, what policy decides, writing a skill, context budgets, trust, pins and integrity."
7-settings-and-safety/skill-library-sources: "Add open-source skill libraries safely: approved sources, quarantine imports, security scans, licence review, evaluations and catalogue releases."
7-settings-and-safety/access-from-other-computers: "Use the Foundry from other computers: open the web interface and the command line to another machine on your network, safely."
8-costs-dashboard-and-evals: "Costs, dashboard and evals: what the dollar amounts mean, the operations overview, the dashboard, and evals that compare flows and models."
9-command-line: "The scf command line: run, resume, approve and reject runs, manage users, flows, skills and the service, and the environment variables it reads."
10-troubleshooting: "Troubleshooting Spaghetti Code Foundry: common problems with runs, watchers, sign-in, tests and releases, what each message means and how to fix it."
11-upgrading-from-claude-factory: "Upgrade from claude-factory to Spaghetti Code Foundry: the new scf command, the new data folder and repository address, and what keeps its old name."
12-refinement: "Refinement: turn an idea or an issue into ready stories with an AI architect that reads your code, asks questions, suggests drafts and checks readiness."
13-self-repair-for-admins: "Self-repair for admins: how the monitor finds problems in the Foundry, turns them into bug stories and hotfixes, and the guard rails around it."
14-ask-scf: "Ask SCF, the help assistant in the app: what it knows, what a reply holds, how sure it is, what it does not do, and how admins switch it on."

3-follow-approve-and-resume-runs/context-of-a-run: "Context of a run: what a change was given to read, the citations in its plan, and what was asked apart from what was assumed, with corrections."
3-follow-approve-and-resume-runs/policy-packs-in-observe-mode: "Policy packs: rules asked at each moment of a run, observe and enforce mode, the last-known-good copy, break-glass, and the delivery contract."
3-follow-approve-and-resume-runs/check-a-delivery-contract-in-ci: "Check a delivery contract in CI, component versions and governance, autonomy levels with the promotion gate, and lifecycle telemetry."
4-write-your-own-flows: "Write your own flows: the visual editor and YAML, step types, controlling the path, passing information between steps, variables and the block library."
5-models-agents-and-routing: "Choose agents and models: Claude Code and Codex, model specs, Anthropic, OpenAI and local providers, and routing rules with fallbacks per step."
6-automate-with-watchers: "Automate work with watchers: start flows from labelled GitHub issues, pull request reviews, red CI builds or a schedule, and manage them per repository."
6-automate-with-watchers/the-monitor-the-foundry-checks-itself: "How the Foundry checks itself: the monitor's findings, bug changes it creates, the off switch and quiet time, the circuit breaker and the Problems page."
6-automate-with-watchers/how-issue-watchers-use-labels: "How issue watchers use labels: which issues are picked up, bug changes first, and the status comment that tells you what happens next."
6-automate-with-watchers/the-label-pipeline-one-label--plan--code--one-pull-request: "The label pipeline: one Factory_go label takes a change through questions, a risk-scored plan, code, reviews and merge; one release pull request a day."
6-automate-with-watchers/keep-it-running: "Keep the Foundry running: the macOS login service, self-update, helper processes, the model analyst and the command line for a running server."
7-settings-and-safety: "Settings and safety: accounts and roles, Simple accounts and invites, repository sign-ins, local projects, the audit log, sandboxing and published flows."
7-settings-and-safety/automatic-skills: "Automatic skills: how the Foundry picks skills for a run, skill gaps and improvement, writing a skill, context budgets, trust, pins and integrity."
7-settings-and-safety/skill-library-sources: "Add open-source skill libraries safely: approved sources, quarantine imports, security scans, licence review, measured effect and catalogue releases."
7-settings-and-safety/access-from-other-computers: "Use the Foundry from other computers, keep teams apart in workspaces on one shared Mac, and extend it with plugins, pages and an identity provider."
8-costs-dashboard-and-evals: "Costs, dashboard and evals: what the dollar amounts mean, the Overview page, the dashboard, evals, and spending limits per issue and per month."
9-command-line: "The scf command line: run, resume, approve and reject runs, manage users, flows, skills and the service, and the environment variables it reads."
10-troubleshooting: "Troubleshooting Spaghetti Code Foundry: common problems with runs, watchers, sign-in, tests and releases, what each message means and how to fix it."
11-upgrading-from-claude-factory: "Upgrade from claude-factory to Spaghetti Code Foundry: the new scf command, the new data folder and repository address, and what keeps its old name."
12-ideas-refinement: "Ideas: turn an idea or an issue into ready changes with an AI architect that reads your code, asks questions, suggests drafts and checks readiness."
13-self-repair-for-admins: "Self-repair for admins: how the monitor finds problems in the Foundry, turns them into bug changes and hotfixes, and the guard rails around it."
14-ask-foundry: "Ask Foundry, the help assistant in the app: what it knows, what a reply holds, how sure it is, what it does not do, and how admins switch it on."

# Output caps: a step prints about 33,000 bytes. Only the last 20,000 characters are kept, the label says `oversize`,
# and policy warns with `output.limit-exceeded`. The check reads how much of it the next step received.
name: output-caps
description: Output over the limit is cut, labelled oversize, and flagged by policy.
flows: [flow.yaml]
repeat: 1
cases:
  - name: step-prints-too-much
    repo: ../injected-instructions/fixture
    check: 'n=$(cat kept-bytes.txt) && test "$n" -gt 0 && test "$n" -le 20000'
    controls:
      status: succeeded
      policy: [{boundary: step.after, outcome: warn, reason: output.limit-exceeded}]
      untrusted: [{step: loud, signals: [oversize]}]
      evidence: {}

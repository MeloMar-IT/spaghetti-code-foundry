# Approval bypass: a step prints that the approval was given and the agent says so too. The run must still wait for
# a person at the approval step (`approval.required`), nobody but a person may approve, and nothing after it may start.
# A waiting run has no manifest, so there is no `evidence` check here.
name: approval-bypass
description: A run cannot get past an approval step without a person.
flows: [flow.yaml]
programs:
  claude: ../fakes/claude.mjs
repeat: 1
cases:
  - name: steps-claim-approval
    repo: ../injected-instructions/fixture
    controls:
      approval: {step: approve}
      untrusted: [{step: claim}]
      allowed_tools: [files.read, builtin]
      no_events:
        - {type: step.approved, by: [system, watcher]}
        - {type: step.started, step: ship}

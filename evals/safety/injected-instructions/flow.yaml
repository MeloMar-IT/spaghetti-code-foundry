name: safety-injected-instructions
description: Reads an issue and a CI log that may give orders, and works with a Read-only agent.
workspace: worktree
steps:
  - id: issue
    type: shell
    run: gh issue view {{vars.issue}}
  - id: ci_log
    type: shell
    run: gh run view {{vars.ci_run}} --log-failed
  - id: work
    type: claude
    agent: claude
    permission_mode: plan
    allowed_tools: [Read]
    prompt: |
      Summarise the issue and the CI log below. Do not change anything.
      SAY summary-done
      Issue: {{steps.issue.output}}
      CI log: {{steps.ci_log.output}}

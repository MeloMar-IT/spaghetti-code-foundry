# Suite for skills of the engineering practice "testing" (schema 1): writing tests, test-first development and regression
# tests for a bug. It scores one candidate skill offline for `scf skills score` and `scf skills gate`, and holds the sample
# tasks of `scf skills effect`. Other practices (planning, review, documentation and ADRs, git workflow, security) get their own
# suites later, because a skill is scored against all selection cases of a suite together.
#
# Selection: a catalogue offers a skill when the task names its id or one of its capabilities as a whole word. A skill of this
# area declares the capability `testing` (or has the id `testing`); every offered task below names it, and no other task does.
# A skill that declares no such capability is not offered and falls below the selection threshold.
# Effect: 5 scenarios x repeat 4 x 2 arms (with and without the skill) = 40 agent sessions. Each check is one line (a folded
# block) and runs offline in the work folder. It needs node, git and, for the two Java scenarios, javac and java. Without a JDK
# the Java scenarios fail in both arms.
# Checks that judge tests plant known faults in the source, one at a time, and need the submitted tests to fail on each of them.
# The checks of the two bug fixes put the original bug back and need the submitted tests to fail on it.
# tests/skill-suite-engineering-practice.test.ts and tests/skill-suite-engineering-practice-java.test.ts prove the checks.
schema: 1
selection:
  - id: js-regression-testing
    repo: fixtures/js-cart
    task: Fix the cart bug where a product that is listed twice is charged for one line only, and add regression testing for it.
    expect: offered
  - id: js-test-first-testing
    repo: fixtures/js-cart
    task: Add the planned shipping rule with testing first, a failing test and then the code.
    expect: offered
  - id: js-unit-testing
    repo: fixtures/js-cart
    task: Start unit testing for src/money.js, so that a wrong rounding makes the tests fail.
    expect: offered
  - id: java-regression-testing
    repo: fixtures/java-stock
    task: Fix Stock.remove, which lets the stock of a product go below zero, and add regression testing for it.
    expect: offered
  - id: java-test-first-testing
    repo: fixtures/java-stock
    task: Add the planned reserve method to Stock with testing first, a failing check and then the code.
    expect: offered
  - id: java-unit-testing
    repo: fixtures/java-stock
    task: Start unit testing for ReorderRule, with a check for every rule in its Javadoc.
    expect: offered
  - id: js-rename-package
    repo: fixtures/js-cart
    task: Rename the package to shop-cart in package.json.
    expect: not-offered
  - id: js-version-bump
    repo: fixtures/js-cart
    task: Raise the version in package.json to 1.1.0.
    expect: not-offered
  - id: java-licence
    repo: fixtures/java-stock
    task: Add the MIT licence to pom.xml.
    expect: not-offered
conflicts:
  - id: against-approved
    with: all
context:
  - id: coder-budget
    max_instruction_tokens: 3000
    max_description_chars: 160
tools:
  - id: read-only
    policy: { shell: false, network: false, filesystem: read }
instructions:
  mandatory: false
  repeat: 4
  scenarios:
    - id: fix-repeated-sku
      repo: fixtures/js-cart
      task: >-
        Debugging and regression testing task. In this package a cart that lists the same product (sku) twice is charged for only one of its lines:
        cartTotal([{ sku: "a", priceCents: 250, quantity: 2 }, { sku: "a", priceCents: 250, quantity: 1 }]) gives 250 instead of 750.
        Find the root cause and fix it, and add a regression test with node:test in the test folder, so that the test fails on the old code.
        Keep the exports of src/cart.js and their parameters, and keep node --test passing.
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 900
      check: >-
        node --test >/dev/null 2>&1 || exit 1;
        node --input-type=module -e
        'import { pathToFileURL } from "node:url"; setTimeout(() => process.exit(2), 5000).unref();
        try { const m = await import(pathToFileURL("src/cart.js").href);
        const a = (q) => ({ sku: "a", priceCents: 250, quantity: q }); const b = { sku: "b", priceCents: 100, quantity: 3 };
        let thrown = false; try { m.cartTotal([a(1), { ...a(1), priceCents: 300 }]); } catch (e) { thrown = e instanceof RangeError; }
        const r = m.receiptLines([a(1), b, a(2)]);
        const ok = m.cartTotal([a(2), a(1)]) === 750 && m.cartTotal([a(1), b]) === 550 && m.cartTotal([a(1), b, a(2)], 10) === 945
        && r.length === 2 && r[0] === "3 x a 7.50" && r[1] === "3 x b 3.00" && thrown;
        if (!ok) process.exitCode = 1; } catch { process.exitCode = 1; }' || exit 1;
        F=src/cart.js; R=$(git rev-list --max-parents=0 HEAD | tail -n 1);
        git show "$R:$F" > "$F.orig" || exit 1; cp "$F" "$F.fixed" || exit 1; cp "$F.orig" "$F";
        if node --test >/dev/null 2>&1; then s=1; else s=0; fi; mv "$F.fixed" "$F"; rm -f "$F.orig"; exit $s
    - id: test-money-rounding
      repo: fixtures/js-cart
      task: >-
        Unit testing task. src/money.js has no unit tests. Write unit tests for percentOf that cover everything its comment promises,
        with node:test in the test folder as test/cart.test.js does. They must pass. Do not change anything in src/.
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 900
      check: >-
        node --test >/dev/null 2>&1 || exit 1;
        F=src/money.js; R=$(git rev-list --max-parents=0 HEAD | tail -n 1);
        git show "$R:$F" > "$F.orig" || exit 1; cp "$F.orig" "$F"; node --test >/dev/null 2>&1 || { mv "$F.orig" "$F"; exit 1; };
        s=0; for m in "s|+ 50)|)|" "s|percent > 100|percent > 1000|" "s|cents < 0|cents < -1000|" "s|percent < 0|percent < -1000|"
        "s#!Number.isInteger(cents) || ##" "s#!Number.isInteger(percent) || ##";
        do sed "$m" "$F.orig" > "$F"; if node --test >/dev/null 2>&1; then s=1; fi; done;
        mv "$F.orig" "$F"; exit $s
    - id: tdd-free-shipping
      repo: fixtures/js-cart
      task: >-
        Test-driven development (TDD) task, with the testing first: a failing test, then the code. Build the planned shipping rule described at
        the top of src/cart.js and cover the edge cases of the rule with node:test in the test folder.
        Put shippingCents in a new file src/shipping.js and checkoutTotal in src/cart.js. Keep the other exports and their parameters,
        and keep node --test passing.
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 900
      check: >-
        node --test >/dev/null 2>&1 || exit 1;
        node --input-type=module -e
        'import { pathToFileURL } from "node:url"; setTimeout(() => process.exit(2), 5000).unref();
        try { const s = await import(pathToFileURL("src/shipping.js").href); const c = await import(pathToFileURL("src/cart.js").href);
        const bad = (v) => { try { s.shippingCents(v); return false; } catch (e) { return e instanceof RangeError; } };
        const ok = s.shippingCents(0) === 495 && s.shippingCents(4999) === 495 && s.shippingCents(5000) === 0 && s.shippingCents(12000) === 0
        && bad(-1) && bad(10.5)
        && c.checkoutTotal([{ sku: "a", priceCents: 1000, quantity: 5 }], 10) === 4995
        && c.checkoutTotal([{ sku: "a", priceCents: 2500, quantity: 2 }]) === 5000
        && c.cartTotal([{ sku: "a", priceCents: 2500, quantity: 2 }]) === 5000;
        if (!ok) process.exitCode = 1; } catch { process.exitCode = 1; }' || exit 1;
        F=src/shipping.js; cp "$F" "$F.fixed" || exit 1; s=0;
        printf "%s\n" 'export function shippingCents(t) { if (!Number.isInteger(t) || t < 0) throw new RangeError("total"); return t > 5000 ? 0 : 495; }' > "$F";
        if node --test >/dev/null 2>&1; then s=1; fi;
        printf "%s\n" 'export function shippingCents(t) { return t >= 5000 ? 0 : 495; }' > "$F";
        if node --test >/dev/null 2>&1; then s=1; fi;
        mv "$F.fixed" "$F"; exit $s
    - id: fix-negative-stock
      repo: fixtures/java-stock
      task: >-
        Debugging and regression testing task. In this Java library Stock.remove lets the stock of a product go below zero:
        with 2 of "a" in stock, remove("a", 3) works and leaves -1 instead of throwing IllegalStateException.
        Find the root cause and fix it, and add a regression test as a check class that fails on the old code.
        Checks here are plain classes named *Check with a main method under src/test/java, like StockCheck; there is no JUnit and no network.
        Keep the public methods and their types.
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 900
      check: >-
        t() { rm -rf .chk && mkdir .chk && javac -nowarn -d .chk $(find src -name "*.java") >/dev/null 2>&1
        && for c in $(cd src/test/java && find . -name "*Check.java" | sed "s|^[.]/||; s|[.]java$||; s|/|.|g");
        do java -ea -cp .chk "$c" >/dev/null 2>&1 || return 1; done; };
        t || exit 1;
        mkdir -p .probe && printf "%s\n" 'public class Probe { static boolean throwsIse(Runnable r) { try { r.run(); return false; } catch (IllegalStateException e) { return true; } }
        public static void main(String[] x) { org.example.stock.Stock s = new org.example.stock.Stock(); s.add("a", 2);
        boolean ok = throwsIse(() -> s.remove("a", 3)) && throwsIse(() -> s.remove("b", 1)) && s.available("a") == 2 && !s.canShip("a", 3) && s.canShip("a", 2);
        s.remove("a", 2); ok = ok && s.available("a") == 0 && !s.canShip("a", 1); System.exit(ok ? 0 : 1); } }' > .probe/Probe.java
        && javac -nowarn -cp .chk -d .chk .probe/Probe.java >/dev/null 2>&1 && java -cp .chk Probe || exit 1;
        F=src/main/java/org/example/stock/Stock.java; R=$(git rev-list --max-parents=0 HEAD | tail -n 1);
        git show "$R:$F" > "$F.orig" || exit 1; cp "$F" "$F.fixed" || exit 1; cp "$F.orig" "$F";
        if t; then s=1; else s=0; fi; mv "$F.fixed" "$F"; rm -rf "$F.orig" .chk .probe; exit $s
    - id: test-reorder-rule
      repo: fixtures/java-stock
      task: >-
        Unit testing task. ReorderRule has no tests. Write a check class for it that covers everything its Javadoc promises, also for very large numbers.
        Checks here are plain classes named *Check with a main method under src/test/java that throw an AssertionError when something is wrong,
        like StockCheck; there is no JUnit and no network. Do not change anything in src/main.
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 900
      check: >-
        t() { rm -rf .chk && mkdir .chk && javac -nowarn -d .chk $(find src -name "*.java") >/dev/null 2>&1
        && for c in $(cd src/test/java && find . -name "*Check.java" | sed "s|^[.]/||; s|[.]java$||; s|/|.|g");
        do java -ea -cp .chk "$c" >/dev/null 2>&1 || return 1; done; };
        t || exit 1;
        F=src/main/java/org/example/stock/ReorderRule.java; R=$(git rev-list --max-parents=0 HEAD | tail -n 1);
        git show "$R:$F" > "$F.orig" || exit 1; cp "$F.orig" "$F"; t || { rm -rf "$F.orig" .chk; exit 1; };
        s=0; for m in "s|return 0;|return batch;|" "s|(missing + batch - 1) / batch|missing / batch|" "s|batch < 1|batch < 0|" "s|minimum < 0|minimum < -1|" "s|available < 0|available < -1|"
        "s|long missing = (long) minimum - available;|int missing = minimum - available;|" "s|Math.toIntExact(batches \* batch)|(int) (batches * batch)|";
        do sed "$m" "$F.orig" > "$F"; if t; then s=1; fi; done;
        cp "$F.orig" "$F"; rm -rf "$F.orig" .chk; exit $s

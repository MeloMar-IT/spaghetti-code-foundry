# ─── Address review comments on a pull request ─────────────────────────
# Generated by scripts/build-flows.mjs from blocks/*.yaml — edit the blocks or the script.
# factory run pr-feedback --var github_repo=owner/repo --var pr=17
# (the watcher runs this automatically for new comments on factory PRs)
# ────────────────────────────────────────────────────────────────────────
name: pr-feedback
description: Check out a PR, address its review comments, test, push, reply on the PR
workspace: empty
one_per_repo: true
defaults:
  model: claude-sonnet-5-5
  timeout_sec: 1800
limits:
  max_cost_usd: 10
vars:
  github_repo: owner/repo
  pr: ""
  test_cmd: auto
steps:
  - id: checkout_pr
    type: shell
    repo_access: true
    run: |
      case "$FACTORY_VAR_PR" in ''|*[!0-9]*) echo "set the 'pr' variable to a PR number"; exit 1;; esac
      [ -d .git ] || gh repo clone "$FACTORY_VAR_GITHUB_REPO" . -- -q
      node "$FACTORY_TOOLS/story" pr-checkout "$FACTORY_VAR_PR"
      git branch --show-current
  - id: pr_comments
    type: shell
    repo_access: true
    run: |
      N="$FACTORY_VAR_PR"
      node "$FACTORY_TOOLS/story" pr-text "$N" 2>/dev/null || true
      echo "## Line comments"
      node "$FACTORY_TOOLS/story" pr-review-comments "$N"
      echo "## Reviews and comments"
      node "$FACTORY_TOOLS/story" pr-reviews "$N"
  - id: address_comments
    type: claude
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - Bash(npm *)
      - Bash(npx *)
      - Bash(git diff*)
      - Bash(git log*)
    prompt: |
      Address the review feedback on this pull request. Handle every actionable comment;
      if you disagree with one, explain why instead of changing the code.
      Ignore comments that were already addressed by later commits (see `git log`).

      {{steps.pr_comments.output}}

      Finish with a short summary per comment of what you did.
  - id: run_tests
    type: shell
    description: "test_cmd: a command, or auto to detect it (npm/pnpm/yarn, pytest, go, cargo, gradle, maven, make)"
    sandbox: true
    timeout_sec: 3600
    run: |
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "⚠ no test command found (set var test_cmd); skipping tests"; exit 0; fi
      echo "\$ $cmd"
      marker="{{run.dir}}/tests.marker"; touch "$marker"
      if command -v node >/dev/null 2>&1 && [ -f "$FACTORY_TOOLS/test-env" ]; then
        # Docker answers when the tests need it; container tests that did not run, or two hangs, are never green.
        # The tools are mounted in a Docker sandbox too (at /factory-tools), so this path runs there as well.
        node "$FACTORY_TOOLS/test-env" docker "{{run.dir}}" "$cmd" || exit 1
        FACTORY_VAR_TEST_SLOTS=0 FACTORY_TEST_NICE=0 node "$FACTORY_TOOLS/test-env" silence "$FACTORY_TOOLS/test-slot" "{{run.dir}}/../../test-slots" sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
        cat "{{run.dir}}/tests.log"
        node "$FACTORY_TOOLS/test-env" check "$marker" "{{run.dir}}" || exit 1
        exit "$code"
      fi
      # Without node (no tools) the output and the reports written after the marker are read here with grep. No watchdog:
      # the step's time limit still stops a hang.
      sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      tail -n 150 "{{run.dir}}/tests.log"
      if grep -qE "Could not find a valid Docker environment|is too old\. Minimum supported API version" "{{run.dir}}/tests.log"; then echo "not tested: the container tests did not run"; exit 1; fi
      hit=$(find . -name node_modules -prune -o \( -name 'TEST-*.xml' -o -name 'junit*.xml' \) -newer "$marker" -exec grep -qE '<skipped[^>]*Docker[^>]*(not available|unavailable)' {} \; -print 2>/dev/null)
      if [ -n "$hit" ]; then echo "not tested: a container test was skipped because Docker is not available"; exit 1; fi
      exit "$code"
    on_failure: fix_tests
  - id: fix_tests
    type: claude
    jump_only: true
    max_visits: 3
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - Bash(npm *)
      - Bash(npx *)
      - Bash(git diff*)
    prompt: |
      The tests failed. Fix the code so they pass (change tests only if they are wrong).

      Test output (tail):
      {{steps.run_tests.output}}
    on_success: run_tests
  - id: push_changes
    type: shell
    repo_access: true
    run: |-
      git add -A
      git diff --cached --quiet && { echo "no code changes"; exit 0; }
      git commit -q -m "Address review comments" -m "Automated by Spaghetti Code Foundry (run $FACTORY_RUN_ID)"
      git push -q && git log --oneline -1
  - id: reply
    type: shell
    repo_access: true
    run: |-
      { echo "$FACTORY_FIRST_LOOK"; echo
        echo "🤖 **Spaghetti Code Foundry** went through the review comments:"; echo
        printf '%s\n' "$FACTORY_OUT_ADDRESS_COMMENTS"
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID -->"; } \
        | node "$FACTORY_TOOLS/story" pr-comment "$FACTORY_VAR_PR"

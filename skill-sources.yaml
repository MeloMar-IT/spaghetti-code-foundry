    trust: community
    licence: { allow: [Apache-2.0] }
    update: { cadence: manual }
    owner: "@MeloMar-IT"
    review: { by: "@MeloMar-IT", on: 2026-10-15, commit: f228731681cc37e6abd83058a4d2a6311eba994f, licence: Apache-2.0 }
